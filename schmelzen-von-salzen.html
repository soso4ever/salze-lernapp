<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schmelzen von Salzen – Lern-App</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#16243b;--mut:#5b6b82;--line:#d9e2ee;--na:#2563eb;--cl:#16a34a;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--acc:#0f4c81}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
h1{font-size:1.25rem;margin:0 0 8px;color:var(--acc)}
.bar{height:10px;background:#e5ecf5;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--na),var(--cl));transition:width .4s}
#pt{font-size:.85rem;color:var(--mut)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
nav button{flex:1;min-width:110px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
nav button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:820px;margin:0 auto;padding:16px}
section.card,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
h2{margin:0 0 8px;font-size:1.3rem}h3{margin:0 0 6px;font-size:1.1rem}
.btn,.opt,.brick,.chip{font:inherit;min-height:48px;border-radius:12px;cursor:pointer}
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;padding:10px 18px;margin:6px 8px 0 0}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.btn:disabled{opacity:.4}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:left;padding:10px 14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.opt:hover{border-color:var(--na)}.opt.sel{border-color:var(--na);background:#e8f0ff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.fb{margin-top:8px;border-radius:10px;padding:0}
.fb.ok,.fb.bad{padding:10px 12px}.fb.ok{background:var(--okb);color:#14532d}.fb.bad{background:var(--badb);color:#7f1d1d}
.q{border-top:1px dashed var(--line);padding:12px 0}.q:first-of-type{border:0}
.qt{font-weight:600;margin:0 0 4px}
.na{color:#6b7280;font-weight:700}.cl{color:var(--cl);font-weight:700}
svg.gfx{width:100%;max-width:460px;height:auto;display:block;margin:10px auto;background:#f8fbff;border-radius:12px}
.arr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 8px;vertical-align:middle}.arr i{font-style:normal;font-size:.8em}
.eq{font-size:1.3rem;text-align:center;padding:10px;background:#f1f6fd;border-radius:12px}
select{font:inherit;min-height:44px;border:2px solid var(--line);border-radius:10px;padding:2px 6px;margin:2px;background:#fff}
select.ok{border-color:var(--ok);background:var(--okb)}select.bad{border-color:var(--bad);background:var(--badb)}
.gap{line-height:2.6}
.pool,.line,.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:8px 0}
.chip,.brick{padding:8px 14px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:600;user-select:none}
.chip.sel,.brick:active{background:var(--acc);color:#fff}
.slots{border:0;padding:0;display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px;border:2px dashed var(--line);border-radius:12px;min-height:64px}
.slot.ok{border:2px solid var(--ok);background:var(--okb)}.slot.bad{border:2px solid var(--bad);background:var(--badb)}
.slot .d{flex:1 1 220px}.slot .z{min-width:130px;min-height:50px;border-radius:10px;background:#eef3fa;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:auto;background:#f8fbff;border:1px solid var(--line);border-radius:12px;display:block}
input[type=range]{width:100%;height:36px;accent-color:var(--acc)}
.tv{font-size:1.6rem;font-weight:700;color:var(--acc)}
.circ{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lamp{width:64px;height:64px;border-radius:50%;background:#cbd5e1;border:3px solid #94a3b8;transition:.3s}
.lamp.on{background:#fde047;border-color:#eab308;box-shadow:0 0 30px 12px #fde04799}
.leg span{margin-right:14px}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.state{background:#f1f6fd;border-left:5px solid var(--na);border-radius:8px;padding:10px 12px;margin-top:10px}
.state.hot{border-color:#ea580c;background:#fff4ea}
.big{font-size:2rem;font-weight:700;color:var(--acc)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style></head><body>
<header><h1>Schmelzen von Salzen</h1><div class="bar"><i id="pb"></i></div><span id="pt">0 % geschafft</span>
<nav id="nav"></nav></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const done=new Set(),TOT=13;
const mark=k=>{if(!done.has(k)){done.add(k);const p=Math.round(done.size/TOT*100);$('#pb').style.width=p+'%';$('#pt').textContent=p+' % geschafft'+(p==100?' – super!':'')}};
const fb=(e,ok,x)=>{e.className='fb '+(ok?'ok':'bad');e.innerHTML=(ok?'✓ ':'✗ ')+x};
const NA='<b class="na">Na⁺</b>',CL='<b class="cl">Cl⁻</b>';
const EQ=`<b class="na">Na⁺</b><b class="cl">Cl⁻</b> (s) <span class="arr"><i>ΔT</i>→</span> ${NA} + ${CL}`;
let raf=0,cur=0;
const mods=['1 Erklären','2 Simulation','3 Üben','4 Abschlusstest'];
const nav=$('#nav');mods.forEach((t,i)=>{const b=h('button','',t);b.onclick=()=>show(i);nav.append(b)});
function show(i){cur=i;cancelAnimationFrame(raf);[...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j==i));const m=$('#m');m.innerHTML='';[explain,sim,practice,test][i](m);scrollTo(0,0)}

/* ---------- Grafiken ---------- */
const ion=(x,y,t)=>`<circle cx="${x}" cy="${y}" r="${t?17:10}" fill="${t?'#16a34a':'#9ca3af'}"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="${t?'#fff':'#1f2937'}" font-size="${t?18:13}" font-weight="700">${t?'−':'+'}</text>`;
const lat=(ox,oy,n,m,free)=>{let s='';for(let r=0;r<m;r++)for(let c=0;c<n;c++){const j=free?[Math.sin(r*7+c*3)*14,Math.cos(r*5+c*11)*14]:[0,0];s+=ion(ox+c*32+j[0],oy+r*32+j[1],(r+c)%2)}return s};
const svg=(w,hh,x)=>`<svg class="gfx" viewBox="0 0 ${w} ${hh}" role="img">${x}</svg>`;
const lampG=(x,y,on)=>`<circle cx="${x}" cy="${y}" r="13" fill="${on?'#fde047':'#cbd5e1'}" stroke="${on?'#eab308':'#94a3b8'}" stroke-width="3"/>`;

/* ---------- Modul 1 ---------- */
const steps=[
['Das Ionengitter',`Kochsalz (NaCl) besteht aus positiv geladenen Natrium-Ionen (${NA}) und negativ geladenen Chlorid-Ionen (${CL}). Entgegengesetzte Ladungen ziehen sich an. Darum sitzen die Ionen abwechselnd in einem regelmäßigen <b>Ionengitter</b>.`,svg(300,120,lat(38,26,8,3))],
['Die Gitterenergie',`Wenn sich aus ${NA} und ${CL} das Ionengitter bildet, wird Energie frei: die <b>Gitterenergie</b>. Sie ist sehr hoch, weil die Anziehung zwischen den Ionen so stark ist. Genau deshalb hält das Gitter so fest zusammen.`,svg(420,130,lat(30,25,3,3,1)+`<text x="125" y="55" font-size="13" fill="#0f766e">Gitterenergie</text><text x="125" y="75" font-size="13" fill="#0f766e">wird frei →</text>`+lat(250,25,5,3))],
['Das Schmelzen',`Beim Schmelzen muss die Gitterenergie wieder <b>aufgewendet</b> werden, damit die Ionen frei beweglich werden. Dafür braucht NaCl eine hohe Temperatur: <b>801 °C</b>.<div class="eq">${EQ}</div><small>(s) steht für „solid“ (fest). ΔT steht für eine Differenz, hier eine Temperaturerhöhung (Wärmezufuhr).</small>`,svg(420,130,lat(20,25,3,3)+`<text x="215" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">ΔT</text><text x="215" y="82" text-anchor="middle" font-size="30">→</text>`+lat(300,25,3,3,1))],
['Die Stromleitung',`Im <b>festen</b> Salz sind die Ionen fest im Gitter eingebaut. Sie können nicht wandern, deshalb leitet es den Strom nicht. In der <b>Schmelze</b> sind die Ionen frei beweglich. Sie transportieren die Ladung, deshalb leitet sie den Strom.`,svg(420,150,lat(30,25,4,3)+lampG(95,130,0)+`<text x="125" y="135" font-size="13">fest: Lampe aus</text>`+lat(240,25,4,3,1)+lampG(260,130,1)+`<text x="285" y="135" font-size="13">Schmelze: an</text>`)]];
function explain(m){let i=0;const c=h('section','card');m.append(c);
const r=()=>{mark('e'+i);c.innerHTML=`<small>Schritt ${i+1} von 4</small><h2>${steps[i][0]}</h2><p>${steps[i][1]}</p>${steps[i][2]}`;
const b=h('button','btn ghost','Zurück');b.disabled=!i;b.onclick=()=>{i--;r()};
const n=h('button','btn',i<3?'Weiter':'Zur Simulation');n.onclick=()=>i<3?(i++,r()):show(1);c.append(b,n)};r()}

/* ---------- Modul 2 ---------- */
function sim(m){
m.innerHTML=`<section class="card"><h2>Experimentiere mit der Temperatur</h2><p>Stell die Temperatur ein und beobachte die Ionen. Schließe dann den Stromkreis.</p>
<canvas id="cv" width="640" height="320"></canvas>
<p class="leg"><span><i class="dot" style="background:#9ca3af;width:12px;height:12px"></i>Na⁺ (grau, klein)</span><span><i class="dot" style="background:#16a34a;width:20px;height:20px"></i>Cl⁻ (grün, groß)</span></p>
<label for="sl">Temperatur: <span class="tv" id="tv">25 °C</span></label>
<input type="range" id="sl" min="0" max="1000" value="25">
<button class="btn ghost" id="b1">Salz bei 25 °C</button><button class="btn ghost" id="b2">Genau am Schmelzpunkt: 801 °C</button>
<div class="circ" style="margin-top:12px"><button class="btn" id="sw" aria-pressed="false">Stromkreis: AUS</button><div class="lamp" id="lamp" role="img" aria-label="Lampe"></div></div>
<div class="state" id="st"></div></section>`;
const cv=$('#cv'),ctx=cv.getContext('2d'),W=640,H=320,sl=$('#sl');let on=false;const ions=[];
for(let r=0;r<5;r++)for(let c=0;c<8;c++){const hx=124+c*56,hy=48+r*56,a=Math.random()*6.28;ions.push({hx,hy,x:hx,y:hy,vx:Math.cos(a),vy:Math.sin(a),t:(r+c)%2})}
sl.oninput=()=>$('#tv').textContent=sl.value+' °C';
$('#b1').onclick=()=>{sl.value=25;sl.oninput()};$('#b2').onclick=()=>{sl.value=801;sl.oninput()};
$('#sw').onclick=e=>{on=!on;e.target.textContent='Stromkreis: '+(on?'EIN':'AUS');e.target.setAttribute('aria-pressed',on)};
function tick(){const T=+sl.value,fr=T>=801,sp=1.2+(T-801)/120,amp=1+T/801*5;ctx.clearRect(0,0,W,H);ctx.font='bold 20px sans-serif';ctx.textAlign='center';
ions.forEach(o=>{if(fr){o.x+=o.vx*sp;o.y+=o.vy*sp;if(o.x<24||o.x>W-24)o.vx*=-1;if(o.y<24||o.y>H-24)o.vy*=-1}else{o.x+=(o.hx+(Math.random()-.5)*amp*2-o.x)*.25;o.y+=(o.hy+(Math.random()-.5)*amp*2-o.y)*.25}
ctx.fillStyle=o.t?'#16a34a':'#9ca3af';ctx.beginPath();ctx.arc(o.x,o.y,o.t?23:13,0,6.28);ctx.fill();ctx.fillStyle=o.t?'#fff':'#1f2937';ctx.font=o.t?'bold 26px sans-serif':'bold 18px sans-serif';ctx.fillText(o.t?'−':'+',o.x,o.y+(o.t?9:6))});
const lit=on&&fr;$('#lamp').classList.toggle('on',lit);
let t;if(!fr){mark('s1');t=T<400?`<b>Festes Salz.</b> Die ${NA}- und ${CL}-Ionen schwingen nur leicht auf ihren festen Plätzen im Ionengitter.`:`<b>Fast am Schmelzpunkt.</b> Die Ionen schwingen heftiger, aber die Gitterenergie hält sie noch auf ihren Plätzen. Es fehlen noch ${801-T} °C.`;
t+=on?` <b>Die Lampe bleibt aus:</b> Die Ionen sind fest eingebaut und können keine Ladung transportieren.`:' Schließe den Stromkreis und prüfe, ob die Lampe leuchtet.'}
else{mark('s2');t=`<b>Salzschmelze!</b> Ab 801 °C wird die Gitterenergie aufgewendet und die Ionen lösen sich aus dem Gitter. Sie sind jetzt frei beweglich.`+(on?' <b>Die Lampe leuchtet:</b> Die frei beweglichen Ionen transportieren die Ladung.':' Schließe den Stromkreis, um die Leitfähigkeit zu testen.');if(lit)mark('s3')}
const s=$('#st');s.classList.toggle('hot',fr);if(s.dataset.k!=t){s.innerHTML=t;s.dataset.k=t}
raf=requestAnimationFrame(tick)}
tick()}

/* ---------- Bausteine für Aufgaben ---------- */
function mc(it,ok){const c=h('div','q');c.innerHTML=`<p class="qt">${it.q}</p>`;const box=h('div','opts'),f=h('div','fb'),sol=h('button','btn ghost','Lösung zeigen');sol.hidden=true;let fin=0;
it.o.forEach((t,i)=>{const b=h('button','opt',t);b.onclick=()=>{if(fin)return;if(i==it.a){fin=1;b.classList.add('ok');fb(f,1,'Richtig! '+it.why);sol.hidden=true;ok&&ok()}else{b.classList.add('bad');b.disabled=true;fb(f,0,'Noch nicht ganz. Tipp: '+it.hint);sol.hidden=false}};box.append(b)});
sol.onclick=()=>{fin=1;box.children[it.a].classList.add('ok');fb(f,1,'Lösung: '+it.o[it.a]+' – '+it.why);sol.hidden=true};
c.append(box,f,sol);return c}
function sec(t,intro,nodes){const s=h('section','card');s.innerHTML=`<h2>${t}</h2><p>${intro}</p>`;s.append(...nodes);return s}
function group(items,key){let n=0;return items.map(it=>mc(it,()=>{if(++n==items.length)mark(key)}))}
const TF=(q,a,why,hint)=>({q,o:['Wahr','Falsch'],a:a?0:1,why,hint});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const MC1=[{q:'Warum hat NaCl eine so hohe Schmelztemperatur (801 °C)?',o:['Die Na⁺- und Cl⁻-Ionen halten im Gitter sehr stark zusammen (hohe Gitterenergie).','Salz besteht aus Molekülen, die sich kaum bewegen.','Salz ist einfach sehr schwer.','Die Ionen im Gitter haben keine Ladung.'],a:0,why:'Die starke Anziehung zwischen + und − bedeutet hohe Gitterenergie. Beim Schmelzen muss sie wieder aufgewendet werden.',hint:'Denk an die Ladungen: Entgegengesetzt geladene Ionen ziehen sich an. Was heißt das für den Zusammenhalt?'},
{q:'Was passiert mit der Gitterenergie, wenn sich das Ionengitter bildet?',o:['Sie wird frei.','Sie muss zugeführt werden.','Sie bleibt unverändert.'],a:0,why:'Beim Bilden des Gitters wird Energie frei. Beim Schmelzen braucht man sie wieder.',hint:'Schau noch einmal in Erklär-Schritt 2: Wann wird die Gitterenergie frei?'}];
const TFS=[TF('Festes Kochsalz leitet den Strom.',0,'Im festen Salz sind die Ionen im Gitter fest eingebaut und können nicht wandern.','Können sich feste Ionen bewegen und Ladung transportieren?'),
TF('Salzschmelzen leiten den Strom, weil die Ionen frei beweglich sind.',1,'Die beweglichen Ionen transportieren die elektrische Ladung.','Probiere in der Simulation den Stromkreis bei 900 °C aus.'),
TF('Natriumchlorid schmilzt bei 801 °C.',1,'Das ist die hohe Schmelztemperatur von NaCl.','Der Wert steht im Erklär-Modul, Schritt 3.'),
TF('Beim Schmelzen wird Gitterenergie frei.',0,'Frei wird sie beim Bilden des Gitters. Beim Schmelzen muss sie aufgewendet werden.','Frei oder aufgewendet? Überlege, was beim Schmelzen mit dem Gitter passiert.'),
TF('In einer Salzschmelze bleiben die Ionen auf festen Gitterplätzen.',0,'Genau das ändert sich beim Schmelzen: Die Ionen lösen sich und sind frei beweglich.','Denk an die Simulation oberhalb von 801 °C.')];
const GAPS=[{p:['Beim Schmelzen muss die ',0,' aufgewendet werden, damit die Ionen ',1,' werden.'],o:[['Wärmemenge','Gitterenergie','Ladung'],['frei beweglich','größer','fest']],a:[1,0],hint:'Die Energie, die beim Bilden des Gitters frei wurde, heißt Gitterenergie. Beweglich oder fest?'},
{p:['Festes Salz leitet den Strom ',0,', weil die Ionen im Gitter ',1,' sind.'],o:[['gut','nicht'],['frei beweglich','fest eingebaut']],a:[1,1],hint:'Überlege, ob feste Ionen Ladung transportieren können.'}];
function gap(g){const c=h('div','q'),p=h('p','gap'),sels=[];g.p.forEach(x=>{if(typeof x=='string')p.append(x);else{const s=h('select','');s.innerHTML='<option value="-1">…</option>'+g.o[x].map((t,i)=>`<option value="${i}">${t}</option>`).join('');sels.push(s);p.append(s)}});
const f=h('div','fb'),b=h('button','btn','Prüfen'),so=h('button','btn ghost','Lösung zeigen');so.hidden=true;let res;
b.onclick=()=>{let n=0;sels.forEach((s,i)=>{const k=+s.value==g.a[i];n+=k;s.className=k?'ok':'bad'});if(n==sels.length){fb(f,1,'Richtig, alle Lücken stimmen!');so.hidden=true;res&&res()}else{fb(f,0,`${n} von ${sels.length} Lücken stimmen. Tipp: ${g.hint}`);so.hidden=false}};
so.onclick=()=>{sels.forEach((s,i)=>{s.value=g.a[i];s.className='ok'});fb(f,1,'Hier ist die Lösung. Lies den Satz noch einmal laut.');so.hidden=true};
c.append(p,b,so,f);c.done=fn=>res=fn;return c}

/* Zuordnung */
function match(){const P=[['Gitterenergie','Energie, die frei wird, wenn sich das Ionengitter bildet. Beim Schmelzen muss sie aufgewendet werden.'],['Ionengitter','Regelmäßige, abwechselnde Anordnung von Na⁺- und Cl⁻-Ionen.'],['(s)','„solid“, also: fest.'],['ΔT','Steht über dem Pfeil für Wärmezufuhr bzw. Temperaturerhöhung.']];
const c=h('div'),pool=h('div','pool'),slots=h('div','slots'),f=h('div','fb');let sel=null,drag=null;
const put=(ch,to)=>{if(to.classList.contains('z')&&to.firstChild)pool.append(to.firstChild);to.append(ch);if(sel)sel.classList.remove('sel');sel=null};
pool.ondragover=e=>e.preventDefault();pool.ondrop=e=>{e.preventDefault();drag&&pool.append(drag)};
shuf(P).forEach(p=>{const ch=h('button','chip',p[0]);ch.draggable=true;ch.dataset.t=p[0];
ch.ondragstart=()=>drag=ch;ch.onclick=e=>{e.stopPropagation();if(ch.parentNode!=pool){pool.append(ch);return}if(sel)sel.classList.remove('sel');sel=sel==ch?null:ch;if(sel)ch.classList.add('sel')};pool.append(ch)});
shuf(P).forEach(p=>{const s=h('div','slot'),d=h('div','d',p[1]),z=h('div','z');z.dataset.t=p[0];s.append(d,z);
z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();drag&&put(drag,z)};z.onclick=()=>{if(sel)put(sel,z)};slots.append(s)});
const b=h('button','btn','Prüfen'),so=h('button','btn ghost','Lösung zeigen');
b.onclick=()=>{let n=0;[...slots.children].forEach(s=>{const z=s.lastChild,k=z.firstChild&&z.firstChild.dataset.t==z.dataset.t;n+=k;s.className='slot '+(z.firstChild?(k?'ok':'bad'):'')});
if(n==4){fb(f,1,'Perfekt, alles richtig zugeordnet!');mark('x4')}else fb(f,0,`${n} von 4 stimmen. Tipp: Lies jede Erklärung genau. Eine Erklärung nennt „frei werden“, eine „fest“, eine „Wärme“.`)};
so.onclick=()=>{[...slots.children].forEach(s=>{const z=s.lastChild,ch=[...document.querySelectorAll('.chip')].find(x=>x.dataset.t==z.dataset.t);z.append(ch);s.className='slot ok'});fb(f,1,'Das ist die richtige Zuordnung.')};
c.append(h('p','','Tippe einen Begriff an und dann das graue Feld. Du kannst ihn auch ziehen. Tippe einen gesetzten Begriff an, um ihn zurückzulegen.'),pool,slots,b,so,f);return c}

/* Gleichung */
function eqCard(){const BR={S:'<b class="na">Na⁺</b><b class="cl">Cl⁻</b> (s)',A:'→',D:'ΔT',N:NA,P:'+',C:CL};let seq=[];
const c=h('div'),pool=h('div','pool'),line=h('div','line'),f=h('div','fb');
const r=()=>{pool.innerHTML='';line.innerHTML='';['N','A','C','S','D','P'].filter(k=>!seq.includes(k)).forEach(k=>{const b=h('button','brick',BR[k]);b.onclick=()=>{seq.push(k);r()};pool.append(b)});
for(let i=0;i<seq.length;i++){const k=seq[i],n=seq[i+1];let ks=[k],t=BR[k];if((k=='A'&&n=='D')||(k=='D'&&n=='A')){ks=[k,n];t='<span class="arr" style="margin:0"><i>ΔT</i>→</span>';i++}const b=h('button','brick',t);b.onclick=()=>{seq=seq.filter(x=>!ks.includes(x));r()};line.append(b)}if(!seq.length)line.textContent='Tippe die Bausteine in der richtigen Reihenfolge an.'};
const ok=()=>/^S(AD|DA)(NPC|CPN)$/.test(seq.join(''));
const b=h('button','btn','Prüfen'),rs=h('button','btn ghost','Neu beginnen'),so=h('button','btn ghost','Lösung zeigen');
b.onclick=()=>{const s=seq.join('');if(ok()){fb(f,1,'Richtig!<div class="eq">'+EQ+'</div>');mark('x5')}else fb(f,0,'Noch nicht ganz. Tipp: '+(seq.length<6?'Es fehlen noch Bausteine, du brauchst alle 6.':s[0]!='S'?'Links steht der Ausgangsstoff, das feste Salz Na⁺Cl⁻ (s).':!/^S(AD|DA)/.test(s)?'Nach dem Salz kommen der Reaktionspfeil und das ΔT für die Wärmezufuhr.':'Rechts stehen die beiden Ionen, getrennt durch ein „+“.'))};
rs.onclick=()=>{seq=[];f.className='fb';f.innerHTML='';r()};so.onclick=()=>{seq=['S','D','A','N','P','C'];r();fb(f,1,'Lösung:<div class="eq">'+EQ+'</div>Das ΔT steht über dem Pfeil.')};
c.append(pool,line,b,rs,so,f);r();return c}

/* ---------- Modul 4 ---------- */
const TQ=[
{q:'Aus welchen Ionen besteht Natriumchlorid?',o:['Na⁺ und Cl⁻','Na⁻ und Cl⁺','Na²⁺ und Cl²⁻'],a:0,tp:'Gitter',ex:'Na⁺ (positiv) und Cl⁻ (negativ).'},
{q:'Wann wird die Gitterenergie frei?',o:['Beim Bilden des Ionengitters','Beim Schmelzen','Beim Auflösen in Luft'],a:0,tp:'Gitterenergie',ex:'Beim Bilden des Gitters wird sie frei.'},
{q:'Bei welcher Temperatur schmilzt NaCl?',o:['100 °C','801 °C','1801 °C'],a:1,tp:'Schmelzen',ex:'Der Schmelzpunkt liegt bei 801 °C.'},
{q:'Beim Schmelzen muss die Gitterenergie aufgewendet werden.',o:['Wahr','Falsch'],a:0,tp:'Gitterenergie',ex:'Sie muss aufgewendet werden, damit die Ionen frei beweglich werden.'},
{q:'Festes Kochsalz leitet den elektrischen Strom.',o:['Wahr','Falsch'],a:1,tp:'Leitfähigkeit',ex:'Im festen Salz sind die Ionen fest eingebaut.'},
{q:'Warum leitet eine Salzschmelze den Strom?',o:['Die Ionen sind frei beweglich.','Die Ionen sind fest im Gitter.','Salz wird zu Metall.'],a:0,tp:'Leitfähigkeit',ex:'Frei bewegliche Ionen transportieren die Ladung.'},
{q:'Was bedeutet das ΔT über dem Reaktionspfeil?',o:['Wärmezufuhr (Temperaturerhöhung)','Das Salz ist fest','Es entsteht Energie'],a:0,tp:'Schreibweise',ex:'ΔT steht für die Temperaturerhöhung, also Wärmezufuhr.'},
{q:'Wofür steht (s) bei Na⁺Cl⁻ (s)?',o:['salt','solid, also fest','schmelzend'],a:1,tp:'Schreibweise',ex:'(s) kommt von „solid“ = fest.'},
{q:'Im Ionengitter sind Na⁺ und Cl⁻ regelmäßig abwechselnd angeordnet.',o:['Wahr','Falsch'],a:0,tp:'Gitter',ex:'Entgegengesetzt geladene Ionen ziehen sich an und sitzen abwechselnd.'}];
const TIPS={Gitter:'Schau dir im Erklär-Modul Schritt 1 an: Na⁺ und Cl⁻ bilden ein Ionengitter.',Gitterenergie:'Merke: Beim Bilden des Gitters wird Gitterenergie frei, beim Schmelzen wird sie aufgewendet (Erklär-Schritt 2 und 3).',Schmelzen:'Probiere in der Simulation aus, was ab 801 °C passiert.',Leitfähigkeit:'Teste in der Simulation den Stromkreis: Nur frei bewegliche Ionen leiten.',Schreibweise:'Übe die Reaktionsgleichung nochmal: (s) = fest, ΔT = Wärmezufuhr.'};
function test(m){let i=0,ans=[];const c=h('section','card');m.append(c);
const q=()=>{const t=TQ[i];c.innerHTML=`<small>Frage ${i+1} von ${TQ.length}</small><h2>${t.q}</h2>`;const box=h('div','opts');let ch=null;
const nx=h('button','btn',i<TQ.length-1?'Weiter':'Auswerten');nx.disabled=true;
t.o.forEach((x,k)=>{const b=h('button','opt',x);b.onclick=()=>{[...box.children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');ans[i]=k;nx.disabled=false};box.append(b)});
nx.onclick=()=>{i++;i<TQ.length?q():res()};c.append(box,nx)};
const res=()=>{mark('t');const w=TQ.filter((t,k)=>ans[k]!=t.a),sc=TQ.length-w.length,tp=[...new Set(w.map(t=>t.tp))];
c.innerHTML=`<h2>Dein Ergebnis</h2><div class="big">${sc} von ${TQ.length} Punkten</div><p>${sc==9?'Fantastisch, alles richtig! 🎉':sc>=7?'Sehr gut gemacht!':sc>=5?'Gut! Mit etwas Übung wird es noch besser.':'Nicht schlimm, das Thema ist neu. Mit den Tipps unten klappt es beim nächsten Mal bestimmt!'}</p>`;
if(w.length){c.append(h('h3','','Das schaust du dir noch einmal an'));const u=h('ul','');tp.forEach(x=>u.append(h('li','',`<b>${x}:</b> ${TIPS[x]}`)));c.append(u,h('h3','','Deine Fehler im Überblick'));
w.forEach(t=>c.append(h('div','q',`<p class="qt">${t.q}</p><div class="fb bad">Deine Antwort: ${t.o[ans[TQ.indexOf(t)]]}</div><div class="fb ok">Richtig: ${t.o[t.a]}. ${t.ex}</div>`)))}
const r=h('button','btn','Test wiederholen');r.onclick=()=>{i=0;ans=[];q()};c.append(r)};q()}
show(0);
</script></body></html>
